<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">
<style>body{background:#050507;color:white}.orbit{font-family:Orbitron}.glass{background:rgba(22,22,30,.9);border:1px solid rgba(250,204,21,.15)}.side{background:#0a0a0f;border-right:1px solid rgba(250,204,21,.15)}.tab-active{background:#facc15!important;color:#000!important}</style>
</head><body class="flex min-h-screen">
<div class="side w-72 p-7 hidden md:flex flex-col"><div><div class="w-12 h-12 rounded-2xl bg-yellow-400 flex items-center justify-center text-black font-black orbit">GT</div><h1 class="orbit font-black text-sm mt-4">GAMETOP MG</h1></div>
<div class="mt-10 space-y-2"><button onclick="tab='dash';render()" id="b-dash" class="w-full text-left px-5 py-4 rounded-2xl bg-white/5 text-xs">📊 Dashboard</button><button onclick="tab='games';render()" id="b-games" class="w-full text-left px-5 py-4 rounded-2xl bg-white/5 text-xs">🎮 Jeux</button><button onclick="tab='tarifs';render()" id="b-tarifs" class="w-full text-left px-5 py-4 rounded-2xl bg-white/5 text-xs">💰 Tarifs</button><button onclick="tab='orders';render()" id="b-orders" class="w-full text-left px-5 py-4 rounded-2xl bg-white/5 text-xs">📦 Commandes <span id="pendingBadge" class="ml-auto bg-red-500 px-2 py-1 rounded-full text-[9px]">0</span></button><button onclick="tab='pay';render()" id="b-pay" class="w-full text-left px-5 py-4 rounded-2xl bg-white/5 text-xs">💳 Paiements</button></div>
<a href="/" class="mt-auto glass rounded-xl py-3 text-center text-[10px] block">← VOIR BOUTIQUE</a></div>
<div class="flex-1 p-4 md:p-10"><div id="content"></div></div>
<script>
let games=[],tarifs=[],orders=[],settings={},tab='dash';
async function load(){let r=await fetch('/api?action=getAll');let d=await r.json();games=d.games;tarifs=d.tarifs;orders=d.orders;settings=d.settings;render();}
async function save(type,data){await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:type,data})});await load();}
function render(){document.querySelectorAll('[id^=b-]').forEach(b=>b.classList.remove('tab-active'));document.getElementById('b-'+tab)?.classList.add('tab-active');document.getElementById('pendingBadge').innerText=orders.filter(o=>o.status==='pending').length;
if(tab==='dash'){content.innerHTML=`<h2 class="orbit text-4xl font-black">DASHBOARD</h2><div class="grid grid-cols-3 gap-4 mt-8"><div class="glass rounded-[24px] p-8"><p class="text-[10px] opacity-30">JEUX</p><p class="orbit text-5xl font-black text-yellow-400 mt-3">${games.length}</p></div><div class="glass rounded-[24px] p-8"><p class="text-[10px] opacity-30">TARIFS</p><p class="orbit text-5xl font-black mt-3">${tarifs.length}</p></div><div class="glass rounded-[24px] p-8"><p class="text-[10px] opacity-30">COMMANDES</p><p class="orbit text-5xl font-black mt-3">${orders.length}</p></div></div>`}
if(tab==='games'){content.innerHTML=`<h2 class="orbit text-2xl font-black">JEUX</h2><div class="glass rounded-[24px] p-6 mt-6 grid md:grid-cols-3 gap-3"><input id="gn" placeholder="Nom" class="bg-black border border-white/10 rounded-xl p-4 text-xs"><input id="gi" placeholder="Image URL" class="bg-black border border-white/10 rounded-xl p-4 text-xs"><input id="gc" placeholder="Cats: Top Up,Abonnement" class="bg-black border border-white/10 rounded-xl p-4 text-xs"><button onclick="games.push({id:Date.now().toString(),name:gn.value,image:gi.value,cats:gc.value.split(',').map(s=>s.trim())});save('saveGames',games)" class="bg-yellow-400 text-black font-black rounded-xl py-4 text-xs col-span-3">+ AJOUTER JEU</button></div><div class="mt-6 space-y-2">${games.map(g=>`<div class="glass rounded-2xl p-4 flex justify-between text-xs"><span>${g.name}</span><button onclick="games=games.filter(x=>x.id!=='${g.id}');save('saveGames',games)" class="text-red-400">X</button></div>`).join('')}</div>`}
if(tab==='tarifs'){content.innerHTML=`<h2 class="orbit text-2xl font-black">TARIFS</h2><div class="glass rounded-[24px] p-6 mt-6 grid md:grid-cols-4 gap-3"><select id="tg" class="bg-black border border-white/10 rounded-xl p-4 text-xs">${games.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select><input id="tc" placeholder="Cat" class="bg-black border border-white/10 rounded-xl p-4 text-xs"><input id="tn" placeholder="Nom" class="bg-black border border-white/10 rounded-xl p-4 text-xs"><input id="tp" type="number" placeholder="Prix" class="bg-black border border-white/10 rounded-xl p-4 text-xs"><button onclick="tarifs.push({id:Date.now(),gameId:tg.value,cat:tc.value,name:tn.value,price:Number(tp.value),image:'https://cdn-icons-png.flaticon.com/512/1029/1029183.png',tag:''});save('saveTarifs',tarifs)" class="bg-yellow-400 text-black font-black py-4 rounded-xl col-span-4">+ AJOUTER</button></div><div class="mt-6 space-y-2">${tarifs.map(t=>`<div class="glass rounded-2xl p-4 flex justify-between text-xs"><span>${t.name} - ${t.price} Ar</span><button onclick="tarifs=tarifs.filter(x=>x.id!==${t.id});save('saveTarifs',tarifs)" class="text-red-400">X</button></div>`).join('')}</div>`}
if(tab==='pay'){content.innerHTML=`<h2 class="orbit text-2xl font-black">PAIEMENTS & USSD</h2><div class="glass rounded-[24px] p-6 mt-6 grid grid-cols-2 gap-3"><input id="m_num" value="${settings.mvola_num}" class="bg-black border border-white/10 rounded-xl p-4 text-xs"><input id="o_num" value="${settings.orange_num}" class="bg-black border border-white/10 rounded-xl p-4 text-xs"><input id="m_ussd" value="${settings.mvola_ussd}" class="bg-black border border-white/10 rounded-xl p-4 text-xs col-span-2"><input id="o_ussd" value="${settings.orange_ussd}" class="bg-black border border-white/10 rounded-xl p-4 text-xs col-span-2"><button onclick="settings.mvola_num=m_num.value;settings.orange_num=o_num.value;settings.mvola_ussd=m_ussd.value;settings.orange_ussd=o_ussd.value;save('saveSettings',settings)" class="col-span-2 bg-yellow-400 text-black font-black py-4 rounded-xl">SAUVEGARDER</button></div>`}
if(tab==='orders'){content.innerHTML=`<h2 class="orbit text-2xl font-black">COMMANDES</h2><div id="olist" class="mt-6 space-y-4"></div>`;renderOrders();}
}
function renderOrders(){document.getElementById('olist').innerHTML=orders.map(o=>`<div class="glass rounded-[24px] p-6"><div class="flex justify-between"><b class="orbit text-xs">#${o.id.toString().slice(-6)} • ${o.total} Ar</b><span class="px-3 py-1 rounded-full text-[9px] bg-yellow-400 text-black">${o.status}</span></div><p class="text-[11px] mt-2">👤 ${o.pseudo} • 🆔 ${o.uid} • Exp: ${o.sender}</p><p class="text-[11px]">💳 ${o.method} • Ref: ${o.ref}</p>${o.proof?`<img src="${o.proof}" class="w-full max-h-[300px] object-contain mt-4 rounded-xl bg-black">`:''}<div class="flex gap-2 mt-4"><button onclick="upd('${o.id}','livré')" class="bg-green-400 text-black px-6 py-2 rounded-full text-[10px]">LIVRER</button><button onclick="del('${o.id}')" class="bg-red-500/20 text-red-400 px-6 py-2 rounded-full text-[10px]">SUPPR</button></div></div>`).join('');}
async function upd(id,s){await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'updateOrder',id,status:s})});load();}
async function del(id){await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'deleteOrder',id})});load();}
load();
</script></body></html>
